<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Essensplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#14110F; --card:#211C18; --card-today:#2A2118;
    --ink:#F5EFE7; --ink-dim:#9A8F84; --accent:#E8A33D;
    --font: Outfit, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:var(--font); color:var(--ink); -webkit-font-smoothing:antialiased; }

  /* Feste Bühne 1024x600, per JS auf den Viewport skaliert. */
  #stage { position:absolute; top:0; left:0; width:1024px; height:600px;
           transform-origin:top left; display:flex; gap:16px; padding:28px; }

  /* --- Links: HEUTE --- */
  #today { flex:0 0 400px; background:var(--card-today); border-radius:22px;
           padding:30px 32px; display:flex; flex-direction:column;
           border-left:6px solid var(--accent); }
  #kw { font-size:17px; font-weight:600; color:var(--accent);
        letter-spacing:.09em; text-transform:uppercase; }
  #today-label { margin-top:auto; font-size:15px; font-weight:600; color:var(--ink-dim);
                 letter-spacing:.22em; text-transform:uppercase; }
  #today-day { font-size:30px; font-weight:300; color:var(--ink-dim); margin-top:2px; }
  #today-meal { font-size:42px; font-weight:700; line-height:1.25; margin-top:14px;
                overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
  #today-note { font-size:19px; color:var(--accent); margin-top:12px; margin-bottom:auto; }

  /* --- Rechts: restliche Woche --- */
  #rest { flex:1; display:flex; flex-direction:column; gap:9px; }
  .row { flex:1; background:var(--card); border-radius:15px; padding:0 20px;
         display:flex; align-items:center; gap:20px; }
  .row.past { opacity:.4; }
  .row .day { flex:0 0 84px; font-size:17px; font-weight:600; color:var(--ink-dim);
              letter-spacing:.04em; }
  .row .meal { font-size:25px; font-weight:400; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  .row .meal.empty { color:var(--ink-dim); font-weight:300; }
  .row .note { margin-left:auto; flex:0 0 auto; font-size:15px; color:var(--accent);
               padding-left:16px; }

  #message { position:absolute; inset:28px; display:none; place-content:center; white-space:pre-line;
             text-align:center; font-size:26px; color:var(--ink-dim); }
</style>
</head>
<body>
<div id="stage">
  <div id="today">
    <div id="kw"></div>
    <div id="today-label">Heute</div>
    <div id="today-day"></div>
    <div id="today-meal"></div>
    <div id="today-note"></div>
  </div>
  <div id="rest"></div>
  <div id="message"></div>
</div>

<script type="module">
import { parseCsv, weekPlan } from './plan.js';

// ┌─────────────────────────────────────────────────────────────────────┐
// │ HIER EINTRAGEN: Google Sheet -> Datei -> Freigeben -> Im Web        │
// │ veröffentlichen -> Blatt wählen -> "Kommagetrennte Werte (.csv)"    │
// │ Sheet-Spalten: Datum | Gericht | Notiz     (Datum: 24.08.2026)      │
// └─────────────────────────────────────────────────────────────────────┘
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWwcvXRklzu2anHNf5uATkHS6PSk4fFnVdT6-d1xvX8eyGpDYON_SXlDjrCZSaGXgEFbQW0NIcBHMv/pub?gid=1495771387&single=true&output=csv';

const fmt = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
const short = (d) => `${d.toLocaleDateString('de-DE', { weekday: 'short' })} · ${d.getDate()}.${d.getMonth() + 1}.`;

function render(plan) {
  document.getElementById('message').style.display = 'none';
  document.getElementById('kw').textContent =
    `KW ${plan.week} · ${fmt(plan.from)} – ${fmt(plan.to)}`;

  const today = plan.days.find(d => d.isToday);
  document.getElementById('today-day').textContent = `${today.weekday}, ${fmt(today.date)}`;
  document.getElementById('today-meal').textContent = today.meal || 'Nichts geplant';
  document.getElementById('today-note').textContent = today.note;

  const rest = document.getElementById('rest');
  rest.replaceChildren(...plan.days.filter(d => !d.isToday).map(d => {
    const row = document.createElement('div');
    row.className = 'row' + (d.date < today.date ? ' past' : '');
    row.innerHTML = `<div class="day"></div><div class="meal"></div><div class="note"></div>`;
    row.children[0].textContent = short(d.date);
    row.children[1].textContent = d.meal || '—';
    row.children[1].classList.toggle('empty', !d.meal);
    row.children[2].textContent = d.note;
    return row;
  }));
}

function showMessage(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.display = 'grid';
}

async function load() {
  try {
    // cache-bust, sonst liefert Google für Stunden die alte Fassung aus
    const res = await fetch(`${CSV_URL}&_=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(weekPlan(parseCsv(await res.text()), new Date()));
  } catch (err) {
    // Blanker Bildschirm an der Küchenwand hilft niemandem.
    showMessage(`Essensplan nicht erreichbar\n${err.message}`);
  }
}

// Die Seite läuft evtl. tagelang durch: nachladen, damit Sheet-Änderungen
// ankommen und die Heute-Markierung über Mitternacht mitwandert.
load();
setInterval(load, 15 * 60 * 1000);

// Skaliert die 1024x600-Bühne auf den echten Viewport (Cast rendert je nach
// Gerät auch 1280x720). Das ist die Stellschraube, falls es nicht passt.
function fit() {
  const s = Math.min(innerWidth / 1024, innerHeight / 600);
  document.getElementById('stage').style.transform =
    `translate(${(innerWidth - 1024 * s) / 2}px, ${(innerHeight - 600 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
