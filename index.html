<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#14110F; --card:#211C18; --card-hi:#2A2118;
    --ink:#F5EFE7; --dim:#9A8F84; --accent:#E8A33D;
    --font: Outfit, "Segoe UI", system-ui, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:var(--font); color:var(--ink); -webkit-font-smoothing:antialiased;
         display:grid; grid-template-rows:auto 1fr; gap:18px; padding:20px; }

  /* ---------- Kopfzeile: Uhr, Datum, Wetter ---------- */
  #kopf { display:flex; align-items:center; gap:28px;
          background:var(--card); border-radius:18px; padding:18px 26px; }
  #uhr { font-size:74px; font-weight:700; line-height:1.15; letter-spacing:-.02em; }
  #datum { font-size:21px; font-weight:300; color:var(--dim); margin-top:4px; }
  #wetter { margin-left:auto; display:flex; align-items:center; gap:26px; }
  #jetzt { display:flex; align-items:center; gap:12px; }
  #jetzt .icon { font-size:44px; }
  #jetzt .grad { font-size:46px; font-weight:600; line-height:1.2; }
  #jetzt .text { font-size:16px; color:var(--dim); }
  #vorhersage { display:flex; gap:16px; }
  #vorhersage > div { text-align:center; min-width:56px; }
  #vorhersage .wtag { font-size:14px; color:var(--dim); }
  #vorhersage .ic   { font-size:24px; line-height:1.3; }
  #vorhersage .temp { font-size:15px; }
  #vorhersage .temp span { color:var(--dim); }

  /* ---------- Kachelraster ---------- */
  #raster { display:grid; grid-template-columns:660fr 562fr; gap:18px; min-height:0; }
  .kachel { background:var(--card); border-radius:18px; padding:20px 24px;
            display:flex; flex-direction:column; min-height:0; }
  .kachel > h2 { font-size:15px; font-weight:600; color:var(--accent);
                 letter-spacing:.14em; text-transform:uppercase; margin-bottom:14px;
                 flex:0 0 auto; }

  /* ---------- Essensplan ---------- */
  #tage { flex:1; display:flex; flex-direction:column; gap:7px; min-height:0; }
  .tag { flex:1; background:var(--bg); border-radius:11px; padding:0 18px;
         display:flex; align-items:center; gap:16px; border:2px solid transparent; }
  .tag.heute { background:var(--card-hi); border-color:var(--accent); }
  .tag.vorbei { opacity:.4; }
  .tag .wt { flex:0 0 132px; font-size:17px; font-weight:600; color:var(--dim);
             white-space:nowrap; }
  .tag.heute .wt { color:var(--accent); }
  .tag .essen { flex:1; font-size:24px; white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis; }
  .tag.heute .essen { font-weight:600; }
  .tag .essen.leer { color:var(--dim); font-weight:300; }
  .tag .notiz { flex:0 0 auto; font-size:14px; color:var(--accent); padding-left:14px;
                white-space:nowrap; }

  .platzhalter { flex:1; display:grid; place-content:center; text-align:center;
                 color:var(--dim); }
  .platzhalter b { display:block; font-size:26px; font-weight:600; color:var(--ink); }
  .platzhalter span { display:block; margin-top:8px; font-size:16px; }
</style>
</head>
<body>
  <div id="kopf">
    <div><div id="uhr">--:--</div><div id="datum"></div></div>
    <div id="wetter">
      <div id="jetzt"></div>
      <div id="vorhersage"></div>
    </div>
  </div>

  <div id="raster">
    <section class="kachel"><h2 id="essen-titel">Essensplan</h2><div id="tage"></div></section>
    <section class="kachel"><h2>Kalender</h2><div id="kalender"></div></section>
  </div>

<script type="module">
import { parseCsv, weekPlan, headerProblem } from './plan.js';
import { holeWetter } from './wetter.js';

// -- Einstellungen -------------------------------------------------------
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWwcvXRklzu2anHNf5uATkHS6PSk4fFnVdT6-d1xvX8eyGpDYON_SXlDjrCZSaGXgEFbQW0NIcBHMv/pub?gid=1495771387&single=true&output=csv';
const ORT = { lat: 52.52, lon: 13.41 };   // <- Koordinaten eintragen (aktuell Berlin)
// ------------------------------------------------------------------------

const $ = (s) => document.querySelector(s);
const fmt = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });

function platzhalter(el, titel, hinweis) {
  el.innerHTML = '<div class="platzhalter"><b></b><span></span></div>';
  el.querySelector('b').textContent = titel;
  el.querySelector('span').textContent = hinweis;
}

// -- Uhr -----------------------------------------------------------------
function uhr() {
  const jetzt = new Date();
  $('#uhr').textContent = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  $('#datum').textContent = jetzt.toLocaleDateString('de-DE',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// -- Essensplan ----------------------------------------------------------
function zeichnePlan(plan) {
  $('#essen-titel').textContent = 'Essensplan · KW ' + plan.week;
  const tage = $('#tage');

  if (!plan.days.some((d) => d.meal)) {
    platzhalter(tage, 'Kein Plan für diese Woche', 'Im Google Sheet nachtragen');
    return;
  }
  const heute = plan.days.find((d) => d.isToday);
  tage.replaceChildren(...plan.days.map((d) => {
    const el = document.createElement('div');
    el.className = 'tag' + (d.isToday ? ' heute' : d.date < heute.date ? ' vorbei' : '');
    el.innerHTML = '<div class="wt"></div><div class="essen"></div><div class="notiz"></div>';
    el.children[0].textContent = `${d.weekday}, ${fmt(d.date)}`;
    el.children[1].textContent = d.meal || '—';
    el.children[1].classList.toggle('leer', !d.meal);
    el.children[2].textContent = d.note;
    return el;
  }));
}

async function ladePlan() {
  try {
    const res = await fetch(`${CSV_URL}&_=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = parseCsv(await res.text());
    const problem = headerProblem(rows);
    if (problem) return platzhalter($('#tage'), 'Sheet-Format stimmt nicht', problem);
    zeichnePlan(weekPlan(rows, new Date()));
  } catch (err) {
    platzhalter($('#tage'), 'Essensplan nicht erreichbar', err.message);
  }
}

// -- Wetter --------------------------------------------------------------
async function ladeWetter() {
  try {
    const { jetzt, tage } = await holeWetter(ORT);
    $('#jetzt').innerHTML =
      `<div class="icon">${jetzt.icon}</div>` +
      `<div><div class="grad">${jetzt.grad}°</div><div class="text">${jetzt.text}</div></div>`;
    $('#vorhersage').replaceChildren(...tage.slice(1).map((t) => {
      const el = document.createElement('div');
      el.innerHTML = `<div class="wtag">${t.name}</div><div class="ic">${t.icon}</div>` +
                     `<div class="temp">${t.max}°<span> ${t.min}°</span></div>`;
      return el;
    }));
  } catch {
    $('#jetzt').innerHTML = '<div class="text">Wetter nicht erreichbar</div>';
    $('#vorhersage').replaceChildren();
  }
}

// -- Start ---------------------------------------------------------------
platzhalter($('#kalender'), 'Noch nicht verbunden', 'Kalender folgt im nächsten Schritt');

uhr();
ladePlan();
ladeWetter();
setInterval(uhr, 10000);
setInterval(ladePlan, 15 * 60000);
setInterval(ladeWetter, 30 * 60000);
</script>
</body>
</html>
